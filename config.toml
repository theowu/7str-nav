baseURL = "/"
languageCode = "zh-cn"
title = "我的创作导航站"
theme = "PaperMod"

# 构建设置
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  defaultTheme = "auto"
  description = "AIGC | 指弹吉他 | 法语 | 小说 | 游戏 | 开源工具"
  keywords = ["AIGC", "指弹", "法语", "小说", "开源工具"]
  copyright = "© 2026"
  githubRepo = ""

  # 关闭PaperMod自带搜索（用我们自己的搜索框）
  enableSearch = false

  # 文章列表设置
  ShowReadingTime = false
  ShowWordCount = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = false
  disableAnchorCopy = true

  # 字体
  fontSize = "1rem"
  hideFooterWhenScrolling = true

# 顶部菜单只保留首页
[menu]
  [[menu.main]]
    name = "🏠 首页"
    url = "/"
    weight = 1

# Markdown渲染：允许原始HTML和内联属性
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许渲染原始HTML（包括script标签）
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true  # 允许块级HTML属性

[outputs]
  home = ["HTML", "RSS", "JSON"]
